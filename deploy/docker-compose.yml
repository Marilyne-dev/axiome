# Lancer :   docker compose --env-file .env.production up -d --build
# Prérequis : python deploy/generer_secrets.py  (crée .env.production avec des secrets aléatoires)
name: axiome

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiome
      POSTGRES_USER: axiome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data          # base de données persistante
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiome -d axiome"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../back
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://axiome:${POSTGRES_PASSWORD}@db:5432/axiome
      STORAGE_DIR: /data/storage
      LOG_FORMAT: json
      PAYMENT_SANDBOX: "false"
    volumes:
      - storage:/data/storage                    # GED, exports TRACFIN, listes de sanctions, résultats de tâches
    ports:
      - "127.0.0.1:8000:8000"                    # exposé en local uniquement : placez un reverse proxy HTTPS devant
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }   # rotation des logs conteneur

  # Mise à jour quotidienne de la liste de sanctions officielles (OFAC + ONU)
  sanctions:
    build: ../back
    restart: unless-stopped
    depends_on: [api]
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://axiome:${POSTGRES_PASSWORD}@db:5432/axiome
      STORAGE_DIR: /data/storage
      LOG_FORMAT: json
    volumes:
      - storage:/data/storage
    entrypoint: ["sh", "-c", "while true; do python -m app.tools.maj_sanctions || true; sleep 86400; done"]

  # Sauvegarde quotidienne (base + fichiers), rotation 14 jours — voir deploy/backup.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGHOST: db
      PGUSER: axiome
      PGDATABASE: axiome
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_JOURS: ${RETENTION_JOURS:-14}
    volumes:
      - storage:/data/storage:ro
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./sauvegardes}:/backups
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh || true; sleep 86400; done"]

volumes:
  pgdata:
  storage:
